<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync AI | المزامنة التعليمية الذكية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <nav id="sidebar" class="sidebar">
        <div class="wallet-card">
            <i class="fas fa-wallet"></i>
            <span>رصيد $SYNC</span>
            <div class="balance">0.00</div>
            <button class="claim-btn">Claim (1000 pts)</button>
        </div>
        <ul class="nav-links">
            <li onclick="showSection('student-portal')">بوابة الطالب</li>
            <li onclick="showSection('store')">متجر التميز</li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="logo">EduSync AI</div>
        </header>

        <section id="dashboard" class="section active">
            <div class="points-box">
                <p>نقاطك الحالية</p>
                <h1 id="user-points">450</h1>
            </div>
            <button class="action-btn">🛒 دخول متجر التميز</button>
        </section>

        <div class="fab-mic">
            <i class="fas fa-microphone"></i>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
