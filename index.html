<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync AI | الهاكاثون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #22d3ee; --bg: #020617; --card: rgba(15, 23, 42, 0.7); --line: rgba(34, 211, 238, 0.2); --danger: #f43f5e; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        
        body { 
            background-color: #020617; 
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- تأثير خلفية النجوم والشبكة المتحركة --- */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
        }

        header { 
            background: rgba(2, 6, 23, 0.85); padding: 15px 20px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 40px; height: 40px; border: 1px solid var(--primary); border-radius: 5px; }
        .menu-icon { color: var(--primary); font-size: 1.5rem; cursor: pointer; }

        .sidebar { 
            position: fixed; right: -280px; top: 0; width: 280px; height: 100%; 
            background: #0f172a; border-left: 2px solid var(--primary); 
            z-index: 2000; padding: 20px;
        }
        .sidebar.active { right: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 15px; color: #cbd5e1; cursor: pointer; }

        .container { padding: 20px; max-width: 500px; margin: auto; position: relative; z-index: 1; }
        .section { display: none; }
        .section.active { display: block; }

        /* تعديل الكروت لتكون شفافة (Glassmorphism) وتظهر الخلفية خلفها */
        .blue-btn { background: rgba(34, 211, 238, 0.1); border: 1px solid var(--primary); padding: 18px; border-radius: 12px; width: 100%; text-align: center; color: white; cursor: pointer; margin-bottom: 15px; font-weight: bold; backdrop-filter: blur(5px); }
        .info-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 25px; margin-top: 25px; backdrop-filter: blur(10px); }
        
        .upload-box { border: 2px dashed var(--primary); border-radius: 20px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer; background: rgba(34, 211, 238, 0.05); }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tool-card { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--line); padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; }
        .tool-card i { font-size: 1.4rem; color: var(--primary); margin-bottom: 8px; display: block; }

        .chat-float { position: fixed; bottom: 25px; left: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; cursor: pointer; box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
        
        /* باقي تنسيقاتك الأصلية */
        .feature-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .feature-item i { color: var(--primary); font-size: 1.3rem; }
        #aiLoading { display: none; text-align: center; margin: 20px 0; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-panel { display: none; margin-top: 20px; padding: 20px; background: rgba(11, 18, 36, 0.9); border-radius: 20px; border: 1px solid var(--primary); }
        .quiz-option { background: #1e293b; border: 1px solid var(--line); padding: 12px; border-radius: 10px; margin-top: 10px; cursor: pointer; text-align: right; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 5000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0f172a; border: 1px solid var(--primary); border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="modal" id="infoModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modalBody"></div>
        <button onclick="document.getElementById('infoModal').style.display='none'" style="width:100%; margin-top:20px; padding:12px; background:var(--primary); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">إغلاق</button>
    </div>
</div>

<header>
    <div class="logo-box">
        <div class="logo-img" style="background: var(--primary);"></div>
        <div>
            <div style="font-size: 1rem; font-weight: 700;">EduSync AI</div>
            <div style="font-size: 0.65rem; color: #94a3b8;">المزامنة التعليمية الذكية</div>
        </div>
    </div>
    <div class="menu-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
</header>

<div class="sidebar" id="sidebar">
    <div style="color:var(--primary); font-size:1.8rem; text-align:left; cursor:pointer;" onclick="toggleSidebar()">&times;</div>
    <div class="sidebar-item" onclick="showSection('home')"><i class="fa-solid fa-house"></i> الرئيسية</div>
    <div class="sidebar-item" onclick="showSection('student')"><i class="fa-solid fa-graduation-cap"></i> بوابة الطالب</div>
    <div class="sidebar-item" onclick="showSection('doctor')"><i class="fa-solid fa-user-tie"></i> بوابة الدكتور</div>
    <div class="sidebar-item" onclick="showSection('settings')"><i class="fa-solid fa-gear"></i> الإعدادات</div>
</div>

<div class="container">
    <div id="home" class="section active">
        <h3 style="text-align: center; margin: 25px 0;">مرحباً بك في EduSync 🚀</h3>
        <div class="blue-btn" onclick="showSection('student')">دخول بوابة الطالب</div>
        <div class="blue-btn" style="color:var(--danger); border-color:var(--danger);" onclick="showSection('doctor')">دخول بوابة الدكتور</div>
        
        <div class="info-card">
            <h4 style="color: var(--primary); margin-bottom: 20px; text-align: center;">لماذا EduSync AI؟ ✨</h4>
            <div class="feature-item"><i class="fa-solid fa-brain"></i><div><div style="font-weight:bold;">تحليل NLP</div><div style="font-size:0.8rem; color:#94a3b8;">معالجة لغات طبيعية متقدمة للمناهج.</div></div></div>
            <div class="feature-item"><i class="fa-solid fa-microphone-lines"></i><div><div style="font-weight:bold;">بودكاست ذكي</div><div style="font-size:0.8rem; color:#94a3b8;">تحويل المذاكرة لتجربة سمعية ممتعة.</div></div></div>
        </div>
    </div>

    <div id="student" class="section">
        <input type="file" id="fInput" style="display:none;" onchange="handleFile(this)">
        <div class="upload-box" onclick="document.getElementById('fInput').click()">
            <i class="fa-solid fa-file-pdf" style="font-size:3rem; color:var(--primary); margin-bottom:15px;"></i>
            <div id="upStatus" style="font-weight:bold;">تحميل مصادر المنهج</div>
        </div>
        <div class="tools-grid">
            <div class="tool-card"><i class="fa-solid fa-headphones"></i>بودكاست</div>
            <div class="tool-card" onclick="runAI('map')"><i class="fa-solid fa-diagram-project"></i>خرائط ذهنية</div>
        </div>
        <div id="mapRes" class="result-panel"></div>
    </div>
</div>

<div class="chat-float"><i class="fa-solid fa-comment-dots"></i></div>

<script>
    // --- منطق الخلفية المتحركة ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                size: Math.random() * 2
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(34, 211, 238, 0.5)";
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 100) {
                    ctx.strokeStyle = `rgba(34, 211, 238, ${0.2 - dist/500})`;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', init);
    init(); draw();

    // --- منطق التطبيق ---
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('sidebar').classList.remove('active');
    }
</script>
</body>
</html>
