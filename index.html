<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync AI | الهاكاثون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="logo-img" style="width:40px; border-radius:5px;">
            <div>
                <b style="display:block; font-size:0.9rem;">EduSync AI</b>
                <small style="color:#22d3ee; font-size:0.7rem;">المزامنة التعليمية الذكية</small>
            </div>
        </div>
        <i class="fa-solid fa-bars" onclick="toggleSidebar()" style="color:#22d3ee; cursor:pointer; font-size:1.2rem;"></i>
    </header>

    <div class="sidebar" id="sidebar">
        <div class="wallet-mini">
            <i class="fa-solid fa-wallet" style="color:#f59e0b;"></i>
            <div style="font-size:0.7rem;">رصيد $SYNC</div>
            <div class="balance-val" id="sidebarBalance" style="color:#f59e0b; font-weight:bold;">0.00</div>
            <button class="claim-btn ready" onclick="mintFromSidebar()" style="background:#f59e0b; color:#000; border:none; border-radius:5px; padding:5px; width:100%; font-size:0.7rem; cursor:pointer;">Claim (1000 pts)</button>
        </div>
        <div class="sidebar-item" onclick="showSection('student')" style="padding:10px; border-bottom:1px solid #1e293b; cursor:pointer;">بوابة الطالب</div>
        <div class="sidebar-item" onclick="showSection('store')" style="padding:10px; border-bottom:1px solid #1e293b; cursor:pointer;">متجر التميز</div>
    </div>

    <main class="container" style="padding:20px; max-width:500px; margin:auto;">
        
        <div id="student" class="section active">
            <div style="background:rgba(34, 211, 238, 0.1); border:1px solid #22d3ee; border-radius:15px; padding:15px; text-align:center; margin-bottom:20px;">
                <div style="font-size:0.8rem; color:#94a3b8;">نقاطك الحالية</div>
                <div id="studentPoints" style="font-size:1.5rem; font-weight:bold; color:#22d3ee;">450</div>
            </div>
            <button onclick="showSection('store')" style="width:100%; background:#22d3ee; color:#000; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">
                <i class="fa-solid fa-cart-shopping"></i> دخول متجر التميز
            </button>
        </div>

        <div id="store" class="section" style="display:none;">
            <h3 style="color:#22d3ee; margin-bottom:20px; text-align:center;">متجر التميز $SYNC</h3>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div style="background:rgba(15, 23, 42, 0.5); border:1px solid #1e293b; padding:15px; border-radius:15px; text-align:center;">
                    <i class="fa-solid fa-file-pdf" style="color:#f43f5e; font-size:2rem;"></i>
                    <div style="font-size:0.8rem; margin:10px 0;">ملخص شابتر 1</div>
                    <div style="color:#f59e0b; font-weight:bold; margin-bottom:10px;">50 $SYNC</div>
                    <button onclick="buyItem('الملخص', 50)" style="background:#22d3ee; color:#000; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">شراء</button>
                </div>
                <div style="background:rgba(15, 23, 42, 0.5); border:1px solid #1e293b; padding:15px; border-radius:15px; text-align:center;">
                    <i class="fa-solid fa-certificate" style="color:#f59e0b; font-size:2rem;"></i>
                    <div style="font-size:0.8rem; margin:10px 0;">شهادة NFT موثقة</div>
                    <div style="color:#f59e0b; font-weight:bold; margin-bottom:10px;">200 $SYNC</div>
                    <button onclick="buyItem('الشهادة', 200)" style="background:#22d3ee; color:#000; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">امتلاك</button>
                </div>
            </div>
            
            <button onclick="showSection('student')" style="margin-top:20px; background:none; border:1px solid #475569; color:#94a3b8; padding:8px; border-radius:8px; width:100%; cursor:pointer;">رجوع للرئيسية</button>
        </div>
    </main>

    <div class="chat-float" style="position:fixed; bottom:20px; left:20px; background:#22d3ee; width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; cursor:pointer;">
        <i class="fa-solid fa-microphone"></i>
    </div>

    <script src="script.js"></script>
</body>
</html>
