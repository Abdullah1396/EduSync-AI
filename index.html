<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync AI | المنصة المتكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #22d3ee; --bg: #020617; --card: #0f172a; --line: #1e293b; --danger: #f43f5e; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.3s; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }

        /* الهيدر */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 15px 5%; background: var(--bg); border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 45px; height: 45px; border-radius: 5px; border: 2px solid var(--primary); object-fit: cover; }

        /* القائمة الجانبية المعدلة لإظهار الشعار */
        .sidebar { position: fixed; right: -280px; top: 0; width: 280px; height: 100%; background: #0f172a; border-left: 2px solid var(--primary); z-index: 2000; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 5px; }
        .sidebar.active { right: 0; }
        
        /* تنسيق الشعار داخل القائمة الجانبية - الإضافة الجديدة */
        .sidebar-logo-container { text-align: center; margin-bottom: 10px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
        .sidebar-logo { width: 80px; height: 80px; border-radius: 10px; border: 2px solid var(--primary); object-fit: cover; }

        .sidebar-item { padding: 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 15px; cursor: pointer; color: #cbd5e1; font-size: 0.95rem; }
        .sidebar-item:hover { color: var(--primary); background: rgba(34, 211, 238, 0.05); }
        
        /* زر الإغلاق */
        .close-btn { font-size: 1.8rem; cursor: pointer; color: var(--primary); position: absolute; top: 10px; left: 15px; line-height: 1; }

        /* الحاوية والأقسام */
        .container { padding: 30px 20px; max-width: 650px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }

        /* المربع الأحمر (لماذا EduSync) */
        .about-app { margin-top: 30px; background: rgba(34, 211, 238, 0.03); border: 1px solid var(--line); border-radius: 20px; padding: 25px; margin-bottom: 40px; }
        .feature-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .feature-item i { color: var(--primary); font-size: 1.4rem; }

        /* الإعدادات */
        .settings-card { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--line); }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
        .settings-item:hover { background: rgba(255,255,255,0.02); }
        .settings-label { font-size: 0.8rem; color: #94a3b8; margin: 15px 5px 5px 0; display: block; }

        /* أدوات الطالب والدكتور */
        .upload-card { border: 2px dashed rgba(34, 211, 238, 0.5); border-radius: 20px; padding: 30px; text-align: center; background: rgba(15, 23, 42, 0.5); margin-bottom: 20px; cursor: pointer; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .tool-btn { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; width: 100%; }
        .tool-btn i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-logo-container">
        <img src="1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="sidebar-logo" alt="Logo" onerror="this.src='https://img.icons8.com/neon/96/artificial-intelligence.png'">
    </div>
    
    <div class="close-btn" onclick="toggleMenu()">&times;
