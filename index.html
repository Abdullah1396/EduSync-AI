<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync AI | الهاكاثون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #22d3ee; 
            --bg: #020617; 
            /* السر في الشفافية العالية هنا */
            --glass-bg: rgba(255, 255, 255, 0.02); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --line: rgba(34, 211, 238, 0.15); 
            --danger: #f43f5e; 
            --success: #10b981; 
            --gold: #f59e0b; 
            --duo: #58cc02; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        
        body { background-color: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        /* خلفية متحركة لرؤية تأثير الشفافية */
        #bg-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; pointer-events: none; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        body::before {
            content: ""; position: fixed; top: 50%; left: 50%; width: 140vw; height: 140vh;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.05) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            animation: breathe 10s infinite ease-in-out;
            z-index: -2; pointer-events: none;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* هيدر شفاف زجاجي */
        header { 
            background: rgba(2, 6, 23, 0.3); padding: 15px 20px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--primary); position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
        }

        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 40px; height: 40px; border: 1px solid var(--primary); border-radius: 5px; }
        .menu-icon { color: var(--primary); font-size: 1.5rem; cursor: pointer; }

        /* تعديل الكروت لتصبح زجاجية بالكامل */
        .info-card, .mission-card, .tool-card, .roadmap-item, .result-panel, .wallet-mini, .modal-content, .gamified-header { 
            background: var(--glass-bg) !important; 
            border: 1px solid var(--glass-border) !important; 
            border-radius: 20px; 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .gamified-header { 
            display: flex; justify-content: space-around; align-items: center; 
            padding: 12px; margin-bottom: 20px; border-color: var(--duo) !important;
        }

        .sidebar { 
            position: fixed; right: -280px; top: 0; width: 280px; height: 100%; 
            background: rgba(15, 23, 42, 0.4); border-left: 1px solid var(--primary); 
            z-index: 2000; padding: 20px;
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        }
        .sidebar.active { right: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 15px; color: #cbd5e1; cursor: pointer; }

        .balance-val { font-size: 1.2rem; font-weight: bold; color: var(--gold); margin-bottom: 10px; }
        .claim-btn { 
            width: 100%; background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid var(--glass-border); 
            padding: 8px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: not-allowed;
        }
        .claim-btn.ready { background: var(--gold); color: black; border: none; cursor: pointer; animation: pulse-gold 2s infinite; }

        .container { padding: 20px; max-width: 500px; margin: auto; position: relative; z-index: 1; }
        .section { display: none; }
        .section.active { display: block; }

        .blue-btn { background: rgba(34, 211, 238, 0.1); border: 1px solid var(--line); padding: 18px; border-radius: 12px; width: 100%; text-align: center; color: white; cursor: pointer; font-weight: bold; backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        
        .upload-box { border: 2px dashed var(--primary); border-radius: 20px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer; background: rgba(34, 211, 238, 0.02); backdrop-filter: blur(5px); }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .roadmap-item { border-right: 4px solid var(--primary) !important; padding: 15px; margin-bottom: 15px; position: relative; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 5px; }

        .chat-float { position: fixed; bottom: 25px; left: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; cursor: pointer; z-index: 4000; }
        .voice-active { animation: pulse-voice 1.5s infinite; background: var(--danger) !important; color: white !important; }
        
        /* Modal Glass */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 5000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="modal" id="infoModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modalBody"></div>
        <button onclick="document.getElementById('infoModal').style.display='none'" style="width:100%; margin-top:20px; padding:12px; background:var(--primary); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">إغلاق</button>
    </div>
</div>

<header>
    <div class="logo-box">
        <img src="1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="logo-img">
        <div>
            <div style="font-size: 1rem; font-weight: 700;">EduSync AI</div>
            <div style="font-size: 0.65rem; color: #94a3b8;">المزامنة التعليمية الذكية</div>
        </div>
    </div>
    <div class="menu-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
</header>

<div class="sidebar" id="sidebar">
    <div style="color:var(--primary); font-size:1.8rem; text-align:left; cursor:pointer;" onclick="toggleSidebar()">&times;</div>
    <div class="wallet-mini">
        <i class="fa-solid fa-wallet"></i>
        <div style="font-size:0.7rem; color:#94a3b8;">رصيد محفظة $SYNC</div>
        <div class="balance-val" id="sidebarBalance">0.00</div>
        <button id="claimBtn" class="claim-btn" onclick="mintFromSidebar()">
            <i class="fa-solid fa-lock" id="claimIcon"></i> Claim (1000 pts)
        </button>
    </div>
    <div class="sidebar-item" onclick="showSection('home')"><i class="fa-solid fa-house"></i> الرئيسية</div>
    <div class="sidebar-item" onclick="showSection('student')"><i class="fa-solid fa-graduation-cap"></i> بوابة الطالب</div>
    <div class="sidebar-item" onclick="showSection('doctor')"><i class="fa-solid fa-user-tie"></i> بوابة الدكتور</div>
</div>

<div class="container">
    <div id="home" class="section active">
        <h3 style="text-align: center; margin: 25px 0;">مرحباً بك في EduSync 🚀</h3>
        <div class="info-card">
            <h4 style="color: var(--primary); margin-bottom: 20px; text-align: center;">لماذا EduSync AI؟ ✨</h4>
            <div style="display:flex; gap:15px; margin-bottom:20px;"><i class="fa-solid fa-brain" style="color:var(--primary);"></i> <div><b>تحليل NLP</b><p style="font-size:0.8rem; color:#94a3b8;">معالجة لغات متقدمة.</p></div></div>
            <div style="display:flex; gap:15px; margin-bottom:20px;"><i class="fa-solid fa-shield-halved" style="color:var(--primary);"></i> <div><b>توثيق Blockchain</b><p style="font-size:0.8rem; color:#94a3b8;">حفظ المكافآت بأمان.</p></div></div>
        </div>
    </div>

    <div id="student" class="section">
        <div class="gamified-header">
            <div style="color:#ff4500; font-weight:bold;"><i class="fa-solid fa-fire"></i> 7 أيام</div>
            <div style="background:rgba(16,185,129,0.1); border:1px solid var(--success); padding:5px 15px; border-radius:50px; font-size:0.8rem;"><i class="fa-solid fa-star"></i> <span id="studentPoints">450</span></div>
        </div>

        <input type="file" id="fInput" style="display:none;" onchange="handleFile(this)">
        <div class="upload-box" onclick="document.getElementById('fInput').click()">
            <i class="fa-solid fa-file-pdf" style="font-size:3rem; color:var(--primary); margin-bottom:15px;"></i>
            <div id="upStatus" style="font-weight:bold;">تحميل مصادر المنهج</div>
        </div>
        <div class="tools-grid">
            <div class="tool-card" style="padding:15px; text-align:center;"><i class="fa-solid fa-headphones"></i>بودكاست</div>
            <div class="tool-card" style="padding:15px; text-align:center;"><i class="fa-solid fa-diagram-project"></i>خرائط ذهنية</div>
        </div>
    </div>
</div>

<div class="chat-float" id="voiceAssistant" onclick="startVoiceRecognition()"><i class="fa-solid fa-microphone"></i></div>

<script>
    // جميع الوظائف البرمجية (Logic) كما هي لضمان عمل التطبيق
    let points = 450;
    let balance = 0.00;
    let isFile = false;

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('sidebar').classList.remove('active');
    }

    function handleFile(input) {
        if(input.files[0]) {
            isFile = true;
            document.getElementById('upStatus').innerHTML = "✅ " + input.files[0].name;
        }
    }

    // جزيئات الخلفية
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function initParticles() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<60; i++) {
            particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, size: Math.random()*2});
        }
    }
    function drawParticles() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "rgba(34, 211, 238, 0.4)";
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1;
            if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(drawParticles);
    }
    window.addEventListener('resize', initParticles);
    initParticles(); drawParticles();
</script>
</body>
</html>
