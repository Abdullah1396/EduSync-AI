<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات</title>

<link rel="stylesheet" href="../style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="modal" id="infoModal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modalBody"></div>
        <button onclick="document.getElementById('infoModal').style.display='none'" style="width:100%; margin-top:20px; padding:12px; background:var(--primary); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
            إغلاق
        </button>
    </div>
</div>

<header>
    <div class="logo-box">
        <img src="../1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="logo-img">

        <div>
            <div style="font-size:1rem; font-weight:800;">الإعدادات</div>
            <div style="font-size:0.65rem; color:#94a3b8;">الدعم والتحكم</div>
        </div>
    </div>

    <div onclick="window.location.href='../index.html'" style="color:var(--primary); font-size:1.6rem; cursor:pointer;">
        <i class="fa-solid fa-arrow-right"></i>
    </div>
</header>

<div class="container">

    <div id="settings" class="section active">

        <h3 style="margin-bottom:20px;">الإعدادات والدعم</h3>

        <div class="info-card" style="padding:0;">
            <div class="sidebar-item" onclick="openModal('privacy')">
                <span>سياسة الخصوصية</span>
                <i class="fa-solid fa-chevron-left" style="margin-right:auto;"></i>
            </div>

            <div class="sidebar-item" onclick="openModal('guide')">
                <span>إرشادات المستخدم</span>
                <i class="fa-solid fa-chevron-left" style="margin-right:auto;"></i>
            </div>

            <div class="sidebar-item" onclick="openModal('contact')">
                <span>تواصل معنا</span>
                <i class="fa-solid fa-chevron-left" style="margin-right:auto;"></i>
            </div>

            <div class="sidebar-item" onclick="window.location.href='roadmap.html'">
                <span>خارطة الطريق</span>
                <i class="fa-solid fa-map-location-dot"></i>
            </div>
        </div>

        <div class="info-card" style="
            max-width:330px;
            margin:18px auto;
            padding:16px;
            border:1px dashed #f59e0b;
            border-radius:18px;
            background:rgba(245,158,11,0.05);
            text-align:center;
        ">
            <i class="fa-solid fa-handshake" style="font-size:1.6rem; color:#f59e0b; margin-bottom:8px;"></i>

            <h4 style="color:#f59e0b; font-size:0.95rem; margin-bottom:8px;">
                الشراكات والرعايات
            </h4>

            <p style="font-size:0.72rem; color:#94a3b8; line-height:1.6; margin-bottom:12px;">
                انضم إلى EduSync لدعم التعليم الذكي وتحفيز الابتكار لدى الطلاب.
            </p>

            <button onclick="openPartnerForm()" class="claim-btn ready" style="width:100%; padding:11px; font-size:0.8rem;">
                تواصل كشريك
            </button>
        </div>

    </div>

</div>

<div class="chat-float" id="voiceAssistant" onclick="startVoiceRecognition()">
    <i class="fa-solid fa-microphone"></i>
</div>

<script src="../script.js"></script>

<script>
function openPartnerForm() {
    document.getElementById('modalBody').innerHTML = `
        <div style="text-align:center;">
            <i class="fa-solid fa-handshake" style="
                font-size:3rem;
                color:#f59e0b;
                margin-bottom:15px;
            "></i>

            <h3 style="color:#f59e0b; margin-bottom:10px;">
                طلب شراكة EduSync AI
            </h3>

            <p style="
                color:#cbd5e1;
                font-size:0.85rem;
                line-height:1.8;
                margin-bottom:18px;
            ">
                نستقبل شراكات الجامعات، الرعايات التعليمية، جهات التوظيف، ومبادرات الذكاء الاصطناعي و Web3.
            </p>

            <div style="
                background:rgba(245,158,11,0.08);
                border:1px dashed rgba(245,158,11,0.45);
                border-radius:14px;
                padding:12px;
                color:#fbbf24;
                font-weight:800;
                margin-bottom:15px;
            ">
                partners@edusync.ai
            </div>

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:8px;
                font-size:0.75rem;
                color:#94a3b8;
                text-align:center;
            ">
                <div>شراكات جامعية</div>
                <div>رعايات تعليمية</div>
                <div>جهات توظيف</div>
                <div>AI / Web3</div>
            </div>
        </div>
    `;

    document.getElementById('infoModal').style.display = 'flex';
}
</script>

</body>
</html>
