
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحفظة</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>
    <div class="logo-box">
        <img src="../1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="logo-img">
        <div>
            <div style="font-size:1rem; font-weight:800;">المحفظة</div>
            <div style="font-size:0.65rem; color:#94a3b8;">Academic Vault</div>
        </div>
    </div>

    <div onclick="window.location.href='../index.html'" style="color:var(--primary); font-size:1.6rem; cursor:pointer;">
        <i class="fa-solid fa-arrow-right"></i>
    </div>
</header>

<div class="container">

    <div class="info-card">
        <h3 style="margin-bottom:18px;">
            <i class="fa-solid fa-wallet"></i>
            الرصيد
        </h3>

        <div style="font-size:2.2rem; color:#f59e0b; font-weight:800; margin-bottom:18px;">
            0.00 $SYNC
        </div>

        <div style="color:#94a3b8; font-size:1rem; margin-bottom:20px;">
            Academic XP :
<span class="xpValue">450</span>
        </div>

        <div style="margin-top:10px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; color:#94a3b8; font-size:0.85rem;">
                <span>التقدم نحو السك</span>
                <span>450 / 1000 XP</span>
            </div>

            <div style="width:100%; height:12px; background:#111827; border-radius:999px; overflow:hidden;">
                <div style="width:45%; height:100%; background:linear-gradient(90deg,#22d3ee,#10b981); border-radius:999px;"></div>
            </div>

            <button id="mintBtn"
onclick="mintSYNC()"
style="
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:16px;
background:#1e293b;
color:#94a3b8;
font-weight:700;
font-size:0.95rem;
cursor:not-allowed;
">
🔒 تحتاج 1000 XP لعملية السك
</button>
        </div>
    </div>

    <div class="info-card" style="margin-top:20px;">
        <h3 style="margin-bottom:15px;">
            <i class="fa-solid fa-receipt"></i>
            سجل التحويلات
        </h3>

        <div style="color:#64748b; font-size:0.9rem;">
            لا توجد عمليات حالياً
        </div>
    </div>

</div>

<script src="../script.js"></script>
</body>
</html>
