<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحفظة</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>
    <div class="logo-box">
        <img src="../1A9FCFDC-779E-4D60-9099-327FB21D028E.png" class="logo-img">
        <div>
            <div style="font-size:1rem; font-weight:800;">المحفظة</div>
            <div style="font-size:0.65rem; color:#94a3b8;">Academic Vault</div>
        </div>
    </div>

    <div onclick="window.location.href='../index.html'" style="color:var(--primary); font-size:1.6rem; cursor:pointer;">
        ←
    </div>
</header>

<div class="container">

    <div class="info-card" style="text-align:center;">
        <h3 style="margin-bottom:14px;">
            <i class="fa-solid fa-wallet"></i>
            Academic Vault
        </h3>

        <div id="balanceValue" style="font-size:2.3rem; color:#f59e0b; font-weight:900; margin:18px 0;">
            SYNC$ 0.00
        </div>

        <div style="color:#94a3b8; font-size:0.95rem;">
            Academic XP : <span class="xpValue">0</span>
        </div>

        <div style="margin-top:18px;">
            <div style="display:flex; justify-content:space-between; color:#94a3b8; font-size:0.8rem; margin-bottom:8px;">
                <span>التقدم نحو السك</span>
                <span><span class="xpValue">450</span> / 1000 XP</span>
            </div>

            <div style="width:100%; height:12px; background:#111827; border-radius:999px; overflow:hidden;">
                <div id="xpProgress" style="width:45%; height:100%; background:linear-gradient(90deg,#22d3ee,#10b981); border-radius:999px;"></div>
            </div>

            <button id="mintBtn" onclick="mintSYNC()" style="
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:18px;
            background:#1e293b;
            color:#94a3b8;
            font-weight:800;
            font-size:0.95rem;
            cursor:not-allowed;
            ">
                🔒 تحتاج 1000 XP لعملية السك
            </button>
        </div>
    </div>

    <div class="info-card" style="margin-top:20px;">
        <h3 style="margin-bottom:16px; color:#22d3ee;">
            <i class="fa-solid fa-shield-halved"></i>
            سجل التوثيق الرقمي
        </h3>

        <div style="background:rgba(34,211,238,0.06); border:1px solid rgba(34,211,238,0.25); border-radius:16px; padding:14px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>Work.pdf</strong>
                <span style="color:#10b981;">Verified</span>
            </div>

            <div style="font-size:0.75rem; color:#94a3b8; line-height:1.7;">
                SHA-256 Hash<br>
                <span style="color:#22d3ee; word-break:break-all;">A81F9C22B7E04D91F3A0C88E51D901AC</span>
            </div>

            <button onclick="window.location.href='blockchain.html'" style="
            width:100%;
            margin-top:12px;
            padding:12px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#22d3ee,#0ea5e9);
            color:#001018;
            font-weight:800;
            cursor:pointer;
            ">
                عرض التحقق على البلوكشين
            </button>
        </div>

        <div style="background:rgba(16,185,129,0.06); border:1px solid rgba(16,185,129,0.25); border-radius:16px; padding:14px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>Chapter 1</strong>
                <span style="color:#10b981;">Stored</span>
            </div>

            <div style="font-size:0.75rem; color:#94a3b8; line-height:1.7;">
                Blockchain Proof<br>
                <span style="color:#10b981;">0x8F3A...91C</span>
            </div>

            <button onclick="window.location.href='blockchain.html'" style="
            width:100%;
            margin-top:12px;
            padding:12px;
            border:none;
            border-radius:14px;
            background:rgba(16,185,129,0.9);
            color:white;
            font-weight:800;
            cursor:pointer;
            ">
                عرض إثبات المعاملة
            </button>
        </div>
    </div>

    <div class="info-card" style="margin-top:20px;">
        <h3 style="margin-bottom:15px;">
            <i class="fa-solid fa-receipt"></i>
            سجل التحويلات
        </h3>

        <div id="txList" style="color:#64748b; font-size:0.9rem;">
            لا توجد عمليات تحويل حالياً
        </div>
    </div>

</div>

<script>
let xp = parseInt(localStorage.getItem("xp") || "0");
let sync = parseInt(localStorage.getItem("sync") || "0");

function updateWalletUI() {
    document.querySelectorAll(".xpValue").forEach(el => {
        el.innerText = xp;
    });

    const balanceValue = document.getElementById("balanceValue");
    balanceValue.innerText = "SYNC$ " + sync.toFixed(2);

    const progress = Math.min((xp / 1000) * 100, 100);
    document.getElementById("xpProgress").style.width = progress + "%";

    const mintBtn = document.getElementById("mintBtn");

    if (xp >= 1000) {
        mintBtn.disabled = false;
        mintBtn.innerHTML = "⚡ سك 1 SYNC الآن";
        mintBtn.style.background = "#10b981";
        mintBtn.style.color = "#fff";
        mintBtn.style.cursor = "pointer";
        mintBtn.style.boxShadow = "0 0 24px rgba(16,185,129,0.35)";
    } else {
        mintBtn.disabled = true;
        mintBtn.innerHTML = "🔒 تحتاج 1000 XP لعملية السك";
        mintBtn.style.background = "#1e293b";
        mintBtn.style.color = "#94a3b8";
        mintBtn.style.cursor = "not-allowed";
        mintBtn.style.boxShadow = "none";
    }

    const lastTx = JSON.parse(localStorage.getItem("lastTx") || "null");
    const txList = document.getElementById("txList");

    if (lastTx) {
        txList.innerHTML = `
            <div style="background:rgba(16,185,129,0.07); border:1px solid rgba(16,185,129,0.25); border-radius:14px; padding:12px; color:#cbd5e1;">
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <strong>+1 SYNC</strong>
                    <span style="color:#10b981;">Confirmed</span>
                </div>
                <div style="font-size:0.75rem; color:#94a3b8; line-height:1.7;">
                    TX: <span style="color:#22d3ee;">${lastTx.tx}</span><br>
                    Hash: <span style="color:#22d3ee;">${lastTx.hash}</span><br>
                    ${lastTx.date}
                </div>
            </div>
        `;
    }
}

function mintSYNC() {
    if (xp < 1000) {
        alert("تحتاج 1000 XP للسك");
        return;
    }

    xp -= 1000;
    sync += 1;

    localStorage.setItem("xp", xp);
    localStorage.setItem("sync", sync);

    localStorage.setItem("lastTx", JSON.stringify({
        file: "Work.pdf",
        hash: "A81F9C22B7E04D91F3A0C88E51D901AC",
        tx: "0x" + Math.random().toString(16).slice(2, 10).toUpperCase(),
        date: new Date().toLocaleString("ar-SA")
    }));

    alert("تم سك 1 SYNC وتوثيق العملية رقمياً");
    updateWalletUI();
}

updateWalletUI();
</script>

</body>
</html>
